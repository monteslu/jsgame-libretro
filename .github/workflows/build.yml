name: Build core

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04   # glibc floor 2.39 set by prebuilt libnode (__isoc23_*)
            lib: jsgame_libretro.so
            harness: true
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            lib: jsgame_libretro.so
            harness: true
          - platform: android-aarch64
            runner: ubuntu-24.04
            lib: jsgame_libretro.so
            harness: false
          # macos-x86_64 parked: free-tier macos-13 Intel runners stall for hours.
          # - platform: macos-x86_64
          #   runner: macos-13
          #   lib: jsgame_libretro.dylib
          #   harness: true
          - platform: macos-aarch64
            runner: macos-14
            lib: jsgame_libretro.dylib
            harness: true
          - platform: windows-x86_64
            runner: windows-2022
            lib: jsgame_libretro.dll
            harness: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with: { node-version: 22 }

      - name: Install static libc++ + GLES3 headers (linux)
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev libgles2-mesa-dev libegl1-mesa-dev

      - name: Download ANGLE (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          ARCH=x64; [ "${{ matrix.platform }}" = "macos-aarch64" ] && ARCH=arm64
          mkdir -p deps/angle/lib
          curl -sL "https://github.com/kivy/angle-builder/releases/download/chromium-7151_rev1/angle-macos-${ARCH}.tar.gz" | tar xz -C deps/angle
          find deps/angle -maxdepth 1 -name '*.dylib' -exec mv {} deps/angle/lib/ \;
          echo "ANGLE_DIR=$PWD/deps/angle" >> "$GITHUB_ENV"

      - name: Download ANGLE (Windows)
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        run: |
          curl -sL https://github.com/mmozeiko/build-angle/releases/download/2026-03-01/angle-x64-2026-03-01.zip -o angle.zip
          unzip -q angle.zip -d deps/angle_tmp
          mkdir -p deps/angle/include deps/angle/lib
          ADIR=$(ls deps/angle_tmp | head -1)
          cp -r deps/angle_tmp/$ADIR/include/* deps/angle/include/
          for f in deps/angle_tmp/$ADIR/lib/*.dll.lib; do cp "$f" "deps/angle/lib/$(basename "$f" .dll.lib).lib"; done
          rm -rf deps/angle_tmp
          echo "ANGLE_DIR=$PWD/deps/angle" >> "$GITHUB_ENV"

      - name: Fetch prebuilt deps (libnode + libcanvas + simde)
        shell: bash
        run: ./scripts/fetch-deps.sh ${{ matrix.platform }}

      - name: Build (host)
        if: matrix.platform != 'android-aarch64'
        shell: bash
        run: ./scripts/build.sh

      - name: Build (android cross)
        if: matrix.platform == 'android-aarch64'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_NDK=$ANDROID_NDK_LATEST_HOME \
            -DLIBCANVAS_A=$PWD/deps/libcanvas/libcanvas.a \
            -DSKIA_LIB_DIR=$PWD/deps/libcanvas/skia
          cmake --build build -j4

      - name: Headless harness (realm demo, pixel asserts)
        if: matrix.harness
        shell: bash
        run: |
          # macOS dlopen/dlsym live in libc — no -ldl there
          if [ "$RUNNER_OS" = "macOS" ]; then cc -o test/harness test/harness.c;
          else cc -o test/harness test/harness.c -ldl; fi
          JSGAME_RUNTIME_DIR=$PWD/runtime ./test/harness \
            build/${{ matrix.lib }} test-games/s2-demo/s2-demo.jsg 60

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          strip build/${{ matrix.lib }} 2>/dev/null || true
          # Bundle ANGLE runtime libs next to the core (macOS/Windows have no
          # system GLES; the loader needs libGLESv2/libEGL alongside the core).
          ANGLE_LIBS=""
          if [ -d deps/angle/lib ]; then
            cp deps/angle/lib/*.dylib build/ 2>/dev/null || true
            cp deps/angle/*.dll deps/angle/lib/*.dll build/ 2>/dev/null || true
            ANGLE_LIBS=$(ls build/libGLESv2* build/libEGL* build/*.dll 2>/dev/null | xargs -n1 basename 2>/dev/null | tr '\n' ' ')
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a dist/jsgame_libretro-${{ matrix.platform }}.zip ./build/${{ matrix.lib }} ./jsgame_libretro.info
            for l in $ANGLE_LIBS; do 7z a dist/jsgame_libretro-${{ matrix.platform }}.zip ./build/$l; done
          else
            zip -j dist/jsgame_libretro-${{ matrix.platform }}.zip build/${{ matrix.lib }} jsgame_libretro.info
            for l in $ANGLE_LIBS; do zip -j dist/jsgame_libretro-${{ matrix.platform }}.zip build/$l; done
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: jsgame_libretro-${{ matrix.platform }}
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: jsgame_libretro-*.zip
