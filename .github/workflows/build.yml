name: Build core

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04  # glibc floor 2.39 — set by prebuilt libnode (__isoc23_*); lowering needs a build-libnode rebuild on an older baseline
          # TODO(PLAN §15): linux-aarch64, windows-x86_64, macos-x86_64,
          # macos-aarch64, android-aarch64 — gated on build-libcanvas targets.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Install libc++ (static, for the Skia/libcanvas link)
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev

      - name: Fetch prebuilt deps (libnode + libcanvas)
        run: ./scripts/fetch-deps.sh ${{ matrix.platform }}

      - name: Build
        run: ./scripts/build.sh

      - name: Headless harness (realm demo, pixel asserts)
        run: |
          cc -o test/harness test/harness.c -ldl
          JSGAME_RUNTIME_DIR=$PWD/runtime ./test/harness \
            build/jsgame_libretro.so test-games/s2-demo/s2-demo.jsg 60

      - name: Package
        run: |
          mkdir -p dist
          strip build/jsgame_libretro.so || true
          zip -j dist/jsgame_libretro-${{ matrix.platform }}.zip \
            build/jsgame_libretro.so jsgame_libretro.info

      - uses: actions/upload-artifact@v4
        with:
          name: jsgame_libretro-${{ matrix.platform }}
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: jsgame_libretro-*.zip
