name: Build core

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04   # glibc floor 2.39 set by prebuilt libnode (__isoc23_*)
            lib: jsgame_libretro.so
            harness: true
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            lib: jsgame_libretro.so
            harness: true
          - platform: android-aarch64
            runner: ubuntu-24.04
            lib: jsgame_libretro.so
            harness: false
          # macos-x86_64 parked: free-tier macos-13 Intel runners stall for hours.
          # - platform: macos-x86_64
          #   runner: macos-13
          #   lib: jsgame_libretro.dylib
          #   harness: true
          - platform: macos-aarch64
            runner: macos-14
            lib: jsgame_libretro.dylib
            harness: true
          - platform: windows-x86_64
            runner: windows-2022
            lib: jsgame_libretro.dll
            harness: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with: { node-version: 22 }

      - name: Install static libc++ + GLES3 headers (linux)
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev libgles2-mesa-dev libegl1-mesa-dev

      - name: Download ANGLE (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          ARCH=x64; [ "${{ matrix.platform }}" = "macos-aarch64" ] && ARCH=arm64
          mkdir -p deps/angle/lib
          curl -sL "https://github.com/kivy/angle-builder/releases/download/chromium-7151_rev1/angle-macos-${ARCH}.tar.gz" | tar xz -C deps/angle
          find deps/angle -maxdepth 1 -name '*.dylib' -exec mv {} deps/angle/lib/ \;
          echo "ANGLE_DIR=$PWD/deps/angle" >> "$GITHUB_ENV"

      - name: Download ANGLE (Windows)
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        run: |
          mkdir -p deps/angle_tmp
          curl -sL https://github.com/mmozeiko/build-angle/releases/download/2026-03-01/angle-x64-2026-03-01.zip -o angle.zip
          unzip -q angle.zip -d deps/angle_tmp
          mkdir -p deps/angle/include deps/angle/lib
          ADIR=$(ls deps/angle_tmp | head -1)
          cp -r deps/angle_tmp/$ADIR/include/* deps/angle/include/
          for f in deps/angle_tmp/$ADIR/lib/*.dll.lib; do cp "$f" "deps/angle/lib/$(basename "$f" .dll.lib).lib"; done
          rm -rf deps/angle_tmp
          echo "ANGLE_DIR=$PWD/deps/angle" >> "$GITHUB_ENV"

      # CMakeLists.txt embeds runtime/ via `find_program(ZIP_EXECUTABLE zip
      # REQUIRED)`. The windows-2022 image ships 7z but not GNU `zip`, so the
      # configure step fails ("Could not find ZIP_EXECUTABLE"). Install it.
      - name: Install zip (Windows)
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        run: choco install zip -y --no-progress

      - name: Fetch prebuilt deps (libnode + libcanvas + simde)
        shell: bash
        run: ./scripts/fetch-deps.sh ${{ matrix.platform }}

      - name: Build (host)
        if: matrix.platform != 'android-aarch64'
        shell: bash
        run: ./scripts/build.sh

      - name: Build (android cross)
        if: matrix.platform == 'android-aarch64'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_NDK=$ANDROID_NDK_LATEST_HOME \
            -DLIBCANVAS_A=$PWD/deps/libcanvas/libcanvas.a \
            -DSKIA_LIB_DIR=$PWD/deps/libcanvas/skia
          cmake --build build -j4

      - name: Fix ANGLE dylib paths (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          # ANGLE dylibs have relative install-names (./libEGL.dylib); the core
          # records those and dlopen can't resolve them. Copy ANGLE next to the
          # core and rewrite the references to @loader_path.
          cp deps/angle/lib/*.dylib build/ 2>/dev/null || true
          CORE=build/${{ matrix.lib }}
          for dep in $(otool -L "$CORE" | awk '/libEGL|libGLESv2|libfeature_support|libchrome_zlib/ {print $1}'); do
            base=$(basename "$dep")
            install_name_tool -change "$dep" "@loader_path/$base" "$CORE" || true
          done
          # also fix inter-dylib refs (libGLESv2 -> libEGL etc.)
          for d in build/libEGL.dylib build/libGLESv2.dylib; do
            [ -f "$d" ] || continue
            install_name_tool -id "@loader_path/$(basename "$d")" "$d" || true
            for dep in $(otool -L "$d" | awk '/^\t\.\// {print $1}'); do
              install_name_tool -change "$dep" "@loader_path/$(basename "$dep")" "$d" || true
            done
          done

      - name: Headless harness (realm demo, pixel asserts)
        if: matrix.harness
        shell: bash
        run: |
          # macOS dlopen/dlsym live in libc — no -ldl there
          if [ "$RUNNER_OS" = "macOS" ]; then cc -o test/harness test/harness.c -g;
          else cc -o test/harness test/harness.c -ldl -g; fi
          # TEMP DIAGNOSTIC (revert once aarch64 jsg6 segfault is root-caused):
          # run under gdb on Linux so a crash prints a symbolized backtrace.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y gdb >/dev/null 2>&1 || true
            # gdb -batch exits 0 even on inferior crash; make it print the exit
            # status so we can fail explicitly on a non-zero / signal exit.
            JSGAME_RUNTIME_DIR=$PWD/runtime gdb -batch \
              -ex 'run' -ex 'echo \n== BACKTRACE ==\n' -ex 'bt full' \
              -ex 'echo \n== SHLIBS ==\n' -ex 'info sharedlibrary' \
              -ex 'print $_exitcode' -ex 'print $_exitsignal' \
              --args ./test/harness build/${{ matrix.lib }} test-games/s2-demo/s2-demo.jsg 60 \
              | tee /tmp/gdb.out
            # Fail the step if the inferior took a signal (segfault) or exited != 0.
            if grep -q '_exitsignal = [0-9]' /tmp/gdb.out; then
              echo "::error::harness crashed with a signal (see backtrace above)"; exit 1
            fi
          else
            JSGAME_RUNTIME_DIR=$PWD/runtime ./test/harness \
              build/${{ matrix.lib }} test-games/s2-demo/s2-demo.jsg 60
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          strip build/${{ matrix.lib }} 2>/dev/null || true
          # Bundle ANGLE runtime libs next to the core (macOS/Windows have no
          # system GLES; the loader needs libGLESv2/libEGL alongside the core).
          ANGLE_LIBS=""
          if [ -d deps/angle ]; then
            cp deps/angle/lib/*.dylib build/ 2>/dev/null || true
            cp deps/angle/*.dll deps/angle/lib/*.dll build/ 2>/dev/null || true
            # glob-safe: nullglob so non-matching patterns vanish under set -e
            shopt -s nullglob
            for f in build/libGLESv2* build/libEGL* build/*.dll; do
              ANGLE_LIBS="$ANGLE_LIBS $(basename "$f")"
            done
            shopt -u nullglob
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a dist/jsgame_libretro-${{ matrix.platform }}.zip ./build/${{ matrix.lib }} ./jsgame_libretro.info
            for l in $ANGLE_LIBS; do 7z a dist/jsgame_libretro-${{ matrix.platform }}.zip ./build/$l; done
          else
            zip -j dist/jsgame_libretro-${{ matrix.platform }}.zip build/${{ matrix.lib }} jsgame_libretro.info
            for l in $ANGLE_LIBS; do zip -j dist/jsgame_libretro-${{ matrix.platform }}.zip build/$l; done
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: jsgame_libretro-${{ matrix.platform }}
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: jsgame_libretro-*.zip
