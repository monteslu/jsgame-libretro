name: Build core

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04   # glibc floor 2.39 set by prebuilt libnode (__isoc23_*)
            lib: jsgame_libretro.so
            harness: true
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            lib: jsgame_libretro.so
            harness: true
          - platform: android-aarch64
            runner: ubuntu-24.04
            lib: jsgame_libretro.so
            harness: false
          # macos-x86_64: the free Intel macos-13 runner is retired/stalls, so
          # build on the arm64 macos-14 runner and CROSS-compile to x86_64 (the
          # Build step passes -DCMAKE_OSX_ARCHITECTURES=x86_64; deps are the
          # x86_64 libcanvas/libnode artifacts). harness:false — can't run an
          # x86_64 dylib on the arm64 host.
          - platform: macos-x86_64
            runner: macos-14
            lib: jsgame_libretro.dylib
            harness: false
          - platform: macos-aarch64
            runner: macos-14
            lib: jsgame_libretro.dylib
            harness: true
          - platform: windows-x86_64
            # windows-2025: libnode v26's .lib needs a newer MSVC STL than
            # windows-2022 ships — else link fails on __std_min_element_8i /
            # __std_rotate / __std_unique_* (vectorized STL algorithm helpers).
            runner: windows-2025
            lib: jsgame_libretro.dll
            harness: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with: { node-version: 22 }

      # Static libc++ for the link (NOT GLES: GLES3 headers are vendored in
      # src/vendor/gl, and the core loads GL at runtime via RetroArch's
      # get_proc_address — it links no GL lib on any platform). No ANGLE anywhere.
      - name: Install static libc++ (linux)
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libc++-dev libc++abi-dev

      # CMakeLists.txt embeds runtime/ via `find_program(ZIP_EXECUTABLE zip
      # REQUIRED)`. The windows-2022 image ships 7z but not GNU `zip`, so the
      # configure step fails ("Could not find ZIP_EXECUTABLE"). Install it.
      - name: Install zip (Windows)
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        run: choco install zip -y --no-progress

      - name: Fetch prebuilt deps (libnode + libcanvas + simde)
        shell: bash
        run: ./scripts/fetch-deps.sh ${{ matrix.platform }}

      - name: Build (host)
        if: matrix.platform != 'android-aarch64'
        shell: bash
        run: |
          # macos-x86_64 is a CROSS build on the arm64 macos-14 runner — tell
          # CMake to emit an x86_64 binary (matches the x86_64 deps fetched above).
          if [ "${{ matrix.platform }}" = "macos-x86_64" ]; then
            ./scripts/build.sh -DCMAKE_OSX_ARCHITECTURES=x86_64
          else
            ./scripts/build.sh
          fi

      - name: Build (android cross)
        if: matrix.platform == 'android-aarch64'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_NDK=$ANDROID_NDK_LATEST_HOME \
            -DLIBCANVAS_A=$PWD/deps/libcanvas/libcanvas.a \
            -DSKIA_LIB_DIR=$PWD/deps/libcanvas/skia
          cmake --build build -j4

      - name: Headless harness (realm demo, pixel asserts)
        if: matrix.harness
        shell: bash
        run: |
          # macOS dlopen/dlsym live in libc — no -ldl there
          if [ "$RUNNER_OS" = "macOS" ]; then cc -o test/harness test/harness.c;
          else cc -o test/harness test/harness.c -ldl; fi
          JSGAME_RUNTIME_DIR=$PWD/runtime ./test/harness \
            build/${{ matrix.lib }} test-games/s2-demo/s2-demo.jsg 60

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          strip build/${{ matrix.lib }} 2>/dev/null || true
          # Single self-contained core + .info — the core links no GL library
          # (loads GL from RetroArch's get_proc_address), so there are no ANGLE /
          # GLES sidecars to bundle on any platform.
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a dist/jsgame_libretro-${{ matrix.platform }}.zip ./build/${{ matrix.lib }} ./jsgame_libretro.info
          else
            zip -j dist/jsgame_libretro-${{ matrix.platform }}.zip build/${{ matrix.lib }} jsgame_libretro.info
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: jsgame_libretro-${{ matrix.platform }}
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v3
        with:
          files: jsgame_libretro-*.zip
