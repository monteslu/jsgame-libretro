<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>three-game</title>
  <style>
    /* Fill the window and center the canvas (matches simple-*-game-starter). */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      background-color: #05060f; overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Internal resolution 640x480 (4:3) — the SAME size the core renders to.
       The browser scales the CSS box to fit the window; the drawing buffer
       stays 640x480 so the game is pixel-identical in browser and core. -->
  <canvas id="game-canvas" width="640" height="480"></canvas>
  <script>
    // Browser-only display chrome. None of this runs in the libretro core
    // (no window.resize / requestFullscreen there — RetroArch owns the window
    // and fullscreen via its own hotkey), so it is pure web nicety.
    const canvas = document.getElementById('game-canvas');

    // Scale the canvas to fill the window while preserving its 4:3 aspect
    // (letterbox/pillarbox). Only the CSS size changes — width/height attrs
    // (the drawing buffer) stay 640x480.
    function resizeCanvas() {
      const aspectRatio = canvas.width / canvas.height;
      const ww = window.innerWidth, wh = window.innerHeight;
      if (ww / wh > aspectRatio) {
        canvas.style.width = `${wh * aspectRatio}px`;
        canvas.style.height = `${wh}px`;
      } else {
        canvas.style.width = `${ww}px`;
        canvas.style.height = `${ww / aspectRatio}px`;
      }
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Click the canvas to toggle fullscreen (web convenience; the core ignores
    // this — its frontend handles fullscreen itself).
    canvas.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        canvas.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });
  </script>
  <script src="./src/main.js" type="module"></script>
</body>
</html>
