<?xml version="1.0" encoding="UTF-8"?>
<!-- jsgames: custom system for Batocera. Core is symlinked into /usr/lib/libretro by
     the 'jsgame' user service (/userdata/system/services/jsgame). -->
<systemList>
  <system>
    <name>jsgames</name>
    <fullname>JS Games (jsgame)</fullname>
    <manufacturer>jsgame</manufacturer>
    <release>2026</release>
    <hardware>console</hardware>
    <path>/userdata/roms/jsgames</path>
    <extension>.jsg .jsgame .JSG .JSGAME</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>jsgames</platform>
    <theme>jsgames</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core default="true">jsgame</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
